services:
  app:
    image: node:22-bullseye
    container_name: jobbadminvue3
    working_dir: /app
    network_mode: host

    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm-cache:/root/.npm

    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=8092

    command:
      - sh
      - -c
      - |
        LOCK=$$(sha256sum package-lock.json | cut -d' ' -f1)
        if [ "$$(cat node_modules/.lock-hash 2>/dev/null)" != "$$LOCK" ]; then
          npm install --no-audit --no-fund && echo "$$LOCK" > node_modules/.lock-hash
        fi
        npm run dev -- --host 0.0.0.0 --port 8092

volumes:
  node_modules:
  npm-cache:
